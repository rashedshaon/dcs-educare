<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ this.page.title }} | DCS EDUCARE</title>
    <meta name="description" content="DCS Educare - Study abroad consultancy in Bangladesh.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ 'assets/css/dcsedu.css'|theme }}">
    {% styles %}
</head>
<body class="page-{{ this.page.id }}">
    {% partial 'site/header' %}
    <main>{% page %}</main>
    {% partial 'site/footer' %}
    <script src="{{ 'assets/js/dcsedu.js'|theme }}"></script>
    {% framework extras %}{% scripts %}
</body>
</html>
