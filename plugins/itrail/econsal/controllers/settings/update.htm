<?php if (!$this->fatalError): ?>
    <?= Form::open(['class' => 'd-flex flex-column h-100', 'data-change-monitor' => 'true']) ?>
        <div class="flex-grow-1">
            <?= $this->formRender() ?>
        </div>
        <div class="form-buttons">
            <div data-control="loader-container">
                <button type="submit" data-request="onSave" data-hotkey="ctrl+s, cmd+s" class="btn btn-primary"><?= __("Save") ?></button>
                <button type="button" data-request="onSave" data-request-data="{ close: 1 }" data-hotkey="ctrl+enter, cmd+enter" class="btn btn-default"><?= __("Save & Close") ?></button>
            </div>
        </div>
    <?= Form::close() ?>
<?php else: ?>
    <p class="flash-message static error"><?= e($this->fatalError) ?></p>
<?php endif ?>
