tabs:
    fields:
        is_active:
            label: Active
            type: switch
            default: true
            tab: Content
        name:
            label: Country name
            required: true
            tab: Content
            span: left
        slug:
            label: Slug
            tab: Content
            span: right
            preset:
                field: name
                type: slug
        short_description:
            label: Short description
            type: textarea
            size: small
            tab: Content
        content:
            label: Description
            type: richeditor
            tab: Content
        image:
            label: Country image
            type: fileupload
            mode: image
            tab: Content
            span: left
        flag_image:
            label: Flag image
            type: fileupload
            mode: image
            tab: Content
            span: right
        sort_order:
            label: Sort order
            type: number
            default: 0
            tab: Content
        meta_title:
            label: Meta title
            tab: SEO
        meta_description:
            label: Meta description
            tab: SEO
            type: textarea
            size: tiny
        meta_keywords:
            label: Meta keywords
            tab: SEO
        og_image:
            label: OG image
            type: fileupload
            mode: image
            tab: SEO
