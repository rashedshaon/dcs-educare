            tab: Typography
            default: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Merriweather:wght@400;700;900&family=Nunito+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800;900&family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap
            span: full
        body_font_family:
            label: Body font family
            tab: Typography
            type: dropdown
            span: left
            options:
                '"Plus Jakarta Sans", system-ui, sans-serif': Plus Jakarta Sans - premium clean
                '"Inter", system-ui, sans-serif': Inter - modern UI
                '"Manrope", system-ui, sans-serif': Manrope - professional
                '"Nunito Sans", system-ui, sans-serif': Nunito Sans - friendly education
                '"Source Sans 3", system-ui, sans-serif': Source Sans 3 - readable
                'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif': System UI
        heading_font_family:
            label: Heading font family
            tab: Typography
            type: dropdown
            span: right
            options:
                '"Plus Jakarta Sans", system-ui, sans-serif': Plus Jakarta Sans - premium clean
                '"Manrope", system-ui, sans-serif': Manrope - executive
                '"Poppins", system-ui, sans-serif': Poppins - bold modern
                '"Inter", system-ui, sans-serif': Inter - modern UI
                '"Playfair Display", Georgia, serif': Playfair Display - elegant serif
                '"Merriweather", Georgia, serif': Merriweather - editorial serif
        base_font_size:
            label: Base font size
            comment: CSS value, for example 16px or 17px.
            tab: Typography
            default: 16px
            span: left
        heading_font_weight:
            label: Heading font weight
            tab: Typography
            type: dropdown
            default: 800
            span: right
            options:
                700: 700 - Bold
                800: 800 - Extra bold
                900: 900 - Black
